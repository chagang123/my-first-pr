<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>叠叠高</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- 首页：整屏是一座自己在叠的塔 -->
<section id="home" class="screen">
  <canvas id="hero-cv"></canvas>
  <button id="btn-sound" type="button" class="round" aria-label="声音开关">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <div class="home-top">
    <h1>叠叠高</h1>
    <p>点一下落下，没对齐的就切掉</p>
  </div>
  <div class="home-panel">
    <div class="mode-tabs">
      <button id="tab-level" type="button" data-mode="level">闯关</button>
      <button id="tab-endless" type="button" data-mode="endless">无限</button>
    </div>
    <p id="home-best">—</p>
    <button id="btn-start" type="button" class="btn-main">开始</button>
    <nav class="home-nav">
      <button id="nav-levels" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span>选关</span>
      </button>
      <button id="nav-rank" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7M10 17h4v3h-4z"/></svg>
        <span>排行榜</span>
      </button>
      <button id="nav-help" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17" r=".6" class="dot"/></svg>
        <span>玩法</span>
      </button>
      <button id="nav-follow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 19.5a6.5 6.5 0 0 1 13 0"/><path class="plus" d="M19 7v6M16 10h6"/></svg>
        <span id="follow-label">关注作者</span>
      </button>
    </nav>
  </div>
</section>

<!-- 游戏 -->
<section id="game" class="screen hidden">
  <header id="bar">
    <button id="btn-back" type="button" class="round" aria-label="返回主页">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <div class="bar-mid">
      <div id="level">第 1 关</div>
      <div class="bar-track"><div id="bar-fill"></div></div>
      <div id="progress">最佳 0 层</div>
    </div>
    <button id="btn-restart" type="button" class="round" aria-label="重新开始本关">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12a6.5 6.5 0 1 0 2-4.7"/><path d="M5 4v4h4"/></svg>
    </button>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
</section>

<!-- 结算：不挡塔，上面是成绩，下面是按钮，中间露出整座塔 -->
<div id="overlay" class="hidden">
  <div id="sheet">
    <div class="r-top">
      <p class="r-head"><span id="r-kicker"></span><span id="r-tag"></span></p>
      <div class="r-score"><strong id="r-num"></strong><span id="r-unit"></span></div>
      <h2 id="r-title"></h2>
      <p id="r-sub"></p>
    </div>
    <div class="r-gap"></div>
    <div class="r-bottom">
      <dl id="r-stats"></dl>
      <div class="r-track"><div id="r-fill"></div></div>
      <p id="r-hint"></p>
      <button id="r-main" type="button" class="btn-main"></button>
      <p id="r-note"></p>
      <div class="r-links">
        <button id="r-second" type="button"></button>
        <button id="r-third" type="button"></button>
        <button id="r-fourth" type="button"></button>
      </div>
    </div>
  </div>
</div>

<!-- 弹框 -->
<div id="dialog" class="hidden">
  <div id="dlg-box">
    <div id="dlg-art"></div>
    <p id="dlg-kicker"></p>
    <h3 id="dlg-title"></h3>
    <div id="dlg-body"></div>
    <button id="dlg-main" type="button" class="btn-main"></button>
    <button id="dlg-second" type="button" class="btn-text"></button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="./game.js"></script>
</body>
</html>
