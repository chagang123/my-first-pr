<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

a { color: inherit; text-decoration: none; }

/* ══════ 星空画布 ══════ */
canvas#stars {

  width: 100%;

}

/* ══════ 第一屏：Hero ══════ */
.hero {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}

.hero::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 700px;
  height: 700px;
  background: radial-gradient(
    ellipse at center,
    rgba(200, 140, 50, .18) 0%,
    rgba(180, 100, 30, .08) 35%,

  );
  pointer-events: none;
}

.hero-title {
  font-size: clamp(64px, 12vw, 140px);
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1.1;
  background: linear-gradient(

    #f0c56e 0%,
    #e8a140 40%,
    #d07828 70%,

  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;

}

.hero-subtitle {

.hero-buttons {

  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {

  padding: 14px 44px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .18em;

  transition: all .3s;
  cursor: pointer;
}
.btn-solid {
  background: linear-gradient(135deg, #e87830, #f09040);
  color: #fff;
  border: none;
  box-shadow: 0 4px 24px rgba(232, 120, 48, .3);
}
.btn-solid:hover {
  box-shadow: 0 6px 32px rgba(232, 120, 48, .45);
  transform: translateY(-1px);
}

.scroll-hint {

  bottom: 36px;
  left: 50%;

  height: 6px;
  background: rgba(220, 180, 120, .4);
  border-radius: 50%;

  50% { opacity: .8; transform: translateX(-50%) scale(1.5); }

/* ══════ 第二屏：Showcase ══════ */

  justify-content: center;

  background: rgba(20, 18, 14, .95);

  box-shadow: 0 0 60px rgba(200, 150, 60, .08);

.modal-title {

const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w, h, particles = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight * 3;
}

function createParticles() {
  particles = [];
  const count = Math.floor((w * h) / 6000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.3,
      alpha: Math.random() * 0.6 + 0.1,
      drift: (Math.random() - 0.5) * 0.15,
      speed: Math.random() * 0.08 + 0.02,
      flicker: Math.random() * Math.PI * 2
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  const t = Date.now() * 0.001;
  for (const p of particles) {
    const a = p.alpha * (0.6 + 0.4 * Math.sin(t * p.speed * 10 + p.flicker));
    const hue = 30 + Math.random() * 10;
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.drift;
    if (p.x < -5) p.x = w + 5;
    if (p.x > w + 5) p.x = -5;
  }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); createParticles(); });
resize();
createParticles();
draw();

  const container = document.getElementById('modalItems');
  container.innerHTML = '';
  data.subs.forEach((sub, i) => {
    const item = document.createElement('div');
    item.className = 'modal-item';
    item.onclick = () => openLanding(cardIndex, i);
    item.innerHTML = `
      <span class="modal-item-text">${sub.name}</span>
      <span class="modal-item-arrow">▶</span>
    `;
    container.appendChild(item);
  });

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// ══════ 落地页逻辑 ══════
function openLanding(cardIndex, subIndex) {
  const card = menuData[cardIndex];
  const sub = card.subs[subIndex];
  const landing = sub.landing;

  document.getElementById('landingCategory').textContent = card.title;
  document.getElementById('landingTitle').textContent = landing.heading;

  const container = document.getElementById('landingContent');
  container.innerHTML = '';
  landing.sections.forEach(sec => {
    const section = document.createElement('div');
    section.className = 'landing-section';
    section.innerHTML = `
      <div class="landing-label">${sec.label}</div>
      <textarea class="landing-textarea" placeholder="在此编辑内容…">${sec.text}</textarea>
    `;
    container.appendChild(section);
  });

  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('landingOverlay').classList.add('active');
  document.getElementById('landingOverlay').scrollTop = 0;
}

function closeLanding() {
  document.getElementById('landingOverlay').classList.remove('active');
  if (currentCardIndex >= 0) openModal(currentCardIndex);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('landingOverlay').classList.contains('active')) {
      closeLanding();
    } else if (document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();
    }
  }
});
</script>
</body>
</html>
