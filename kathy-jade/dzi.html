<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西藏天珠 — Legend of Dzi</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  color:#fff;
  font-family:'Orbitron',sans-serif;
  overflow-x:hidden;
}

a{color:inherit;text-decoration:none;}

canvas{
  position:fixed;
  inset:0;
  z-index:-3;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,180,120,.12), transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(255,90,40,.08), transparent 45%),
    #000;
  z-index:-4;
}

/* ===== 开场动画 ===== */
#intro{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
  animation:fadeOut 4s ease forwards;
  animation-delay:3s;
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

.intro-title{
  font-size:clamp(30px,6vw,80px);
  letter-spacing:6px;
  color:#ffb36b;
  opacity:0;
  animation:show 2s ease forwards;
}

.intro-sub{
  margin-top:10px;
  color:#aaa;
  opacity:0;
  animation:show 2s ease forwards;
  animation-delay:1s;
}

@keyframes show{to{opacity:1;}}

/* ===== HERO ===== */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
}

.glow{
  position:absolute;
  width:700px;
  height:700px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,180,100,.35), transparent 65%);
  filter:blur(60px);
  animation:pulse 6s infinite;
  pointer-events:none;
}

@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.3;}
  50%{transform:scale(1.25);opacity:1;}
}

h1{
  font-size:clamp(60px,12vw,160px);
  background:linear-gradient(180deg,#fff,#ffd39a,#ff8a2a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:8px;
}

.domain{
  margin-top:10px;
  color:#ffd39a;
  letter-spacing:5px;
}

/* ===== BUTTON ===== */
.btns{
  margin-top:50px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  padding:16px 38px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-size:14px;
  letter-spacing:2px;
  color:#fff;
  font-family:'Orbitron',sans-serif;
  background:linear-gradient(135deg,#ff8a2a,#ff3d00);
  box-shadow:0 0 40px rgba(255,120,60,.35);
  transition:.3s;
}

button:hover{
  transform:scale(1.08) translateY(-5px);
  box-shadow:0 0 90px rgba(255,140,60,.7);
}

/* ===== 展馆区 ===== */
.section{
  padding:140px 8vw;
}

.title{
  font-size:clamp(40px,6vw,90px);
  color:#ffb36b;
  margin-bottom:50px;
}

/* ===== 展品卡片 ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

.card{
  padding:35px;
  border-radius:20px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,180,120,.2);
  cursor:pointer;
  transition:.4s;
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card:hover{
  transform:translateY(-15px) scale(1.02);
  box-shadow:0 0 50px rgba(255,120,60,.2);
}

.card h3{
  color:#ffd39a;
  font-size:22px;
}

.card-arrow{
  font-size:14px;
  color:rgba(255,211,154,.4);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:100px 20px;
}

footer h2{
  font-size:50px;
  color:#ffb36b;
}

footer p{
  margin-top:10px;
  color:rgba(255,255,255,.3);
  font-size:12px;
  letter-spacing:3px;
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:99;
  padding:24px;
}

.modal.active{display:flex;}

.modal-box{
  width:min(92%,850px);
  padding:50px;
  border-radius:30px;
  background:rgba(20,10,5,.95);
  border:1px solid rgba(255,150,80,.3);
  box-shadow:0 0 120px rgba(255,120,60,.25);
  position:relative;
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0;transform:scale(.96) translateY(10px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}

.modal-box h2{
  font-size:28px;
  color:#ffb36b;
  margin-bottom:20px;
  letter-spacing:3px;
}

.close{
  position:absolute;
  right:25px;
  top:15px;
  font-size:28px;
  cursor:pointer;
  color:#ffb36b;
  background:none;
  border:none;
  font-family:'Orbitron',sans-serif;
}

.block{
  margin-top:12px;
  padding:14px 18px;
  border-left:2px solid #ff8a2a;
  background:rgba(255,255,255,.03);
  border-radius:10px;
  line-height:1.8;
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  font-size:15px;
  color:rgba(255,255,255,.85);
  cursor:pointer;
  transition:background .2s;
}

.block:hover{background:rgba(255,255,255,.06);}

.block-clickable{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.block-arrow{
  font-size:11px;
  color:rgba(255,211,154,.4);
  flex-shrink:0;
  margin-left:12px;
}

/* ===== 落地页 ===== */
.landing{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:#000;
  overflow-y:auto;
}

.landing.active{display:block;}

.landing-inner{
  max-width:800px;
  margin:0 auto;
  padding:60px 32px 80px;
}

.landing-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'Orbitron',sans-serif;
  font-size:12px;
  letter-spacing:2px;
  color:rgba(255,179,107,.6);
  cursor:pointer;
  margin-bottom:40px;
  transition:color .2s;
  background:none;
  border:none;
}

.landing-back:hover{color:#ffb36b;}

.landing-category{
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,179,107,.4);
  margin-bottom:12px;
}

.landing-title{
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  font-size:clamp(28px,5vw,42px);
  font-weight:800;
  letter-spacing:2px;
  background:linear-gradient(180deg,#ffd39a,#ff8a2a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:36px;
  line-height:1.2;
}

.landing-section{margin-bottom:28px;}

.landing-label{
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,179,107,.5);
  margin-bottom:10px;
}

.landing-textarea{
  width:100%;
  min-height:120px;
  padding:16px 18px;
  border:1px solid rgba(255,180,120,.15);
  border-radius:10px;
  background:rgba(255,255,255,.03);
  color:#fff;
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  font-size:14px;
  line-height:1.7;
  resize:vertical;
  transition:border-color .3s;
}

.landing-textarea:focus{
  outline:none;
  border-color:rgba(255,180,120,.4);
}

.landing-textarea::placeholder{
  color:rgba(255,255,255,.2);
}

/* mobile */
@media(max-width:768px){
  .btns{flex-direction:column;align-items:center;}
  button{width:220px;}
  .modal-box{padding:32px 24px 28px;}
  .modal-box h2{font-size:20px;}
  .landing-inner{padding:40px 20px 60px;}
  .cards{gap:16px;}
}
</style>
</head>

<body>

<!-- ============================
     修改文字指南
     找到下面带 ← 的地方，直接改文字就行
     点击卡片弹出二级菜单，点击二级菜单进入三级落地页
     三级落地页里的文本框也可以直接编辑
     ============================ -->

<!-- 开场动画 -->
<div id="intro">
  <div class="intro-title">LEGEND OF DZI</div>            <!-- ← 开场标题 -->
  <div class="intro-sub">From the sacred Himalayas</div>  <!-- ← 开场副标题 -->
</div>

<!-- Three.js 背景 -->
<canvas id="bg"></canvas>

<!-- HERO -->
<div class="hero">
  <div class="glow"></div>
  <h1>西藏天珠</h1>                                        <!-- ← 主标题 -->
  <div class="domain">LEGEND OF DZI</div>                  <!-- ← 副标题 -->
  <div class="btns">
    <button onclick="openHeroModal('contact')">CONTACT</button>          <!-- ← 按钮1 -->
    <button onclick="openHeroModal('showcase')">ENTER SHOWCASE</button>  <!-- ← 按钮2 -->
  </div>
</div>

<!-- 展馆区 -->
<section class="section" id="showcase">
  <h2 class="title">LEGEND OF DZI</h2>                    <!-- ← 板块标题 -->
  <div class="cards">
    <div class="card" onclick="openModal(0)">
      <h3>ORIGIN RELIC</h3>                                <!-- ← 卡片1 -->
      <span class="card-arrow">▶</span>
    </div>
    <div class="card" onclick="openModal(1)">
      <h3>EYE CODE SYSTEM</h3>                             <!-- ← 卡片2 -->
      <span class="card-arrow">▶</span>
    </div>
    <div class="card" onclick="openModal(2)">
      <h3>PROTECTION FIELD</h3>                            <!-- ← 卡片3 -->
      <span class="card-arrow">▶</span>
    </div>
    <div class="card" onclick="openModal(3)">
      <h3>ENERGY UNIVERSE</h3>                             <!-- ← 卡片4 -->
      <span class="card-arrow">▶</span>
    </div>
  </div>
</section>

<footer id="contact">
  <h2>Legendofdzi.com</h2>                                 <!-- ← 域名 -->
  <p>&copy; 2026 IMMERSIVE SHOWCASE SYSTEM</p>             <!-- ← 版权 -->
</footer>

<!-- 弹窗 -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalItems"></div>
  </div>
</div>

<!-- 落地页 -->
<div class="landing" id="landing">
  <div class="landing-inner">
    <button class="landing-back" onclick="closeLanding()">◁ BACK</button>
    <div class="landing-category" id="landingCategory"></div>
    <div class="landing-title" id="landingTitle"></div>
    <div id="landingContent"></div>
  </div>
</div>

<script>
// ===== Three.js 3D 星空 =====
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('bg'), alpha: true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const geo = new THREE.BufferGeometry();
const count = 2200;
const pos = new Float32Array(count * 3);

for (let i = 0; i < count * 3; i++) {
  pos[i] = (Math.random() - 0.5) * 30;
}

geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

const mat = new THREE.PointsMaterial({
  size: 0.035,
  color: 0xffb36b,
  transparent: true,
  opacity: 0.85
});

const points = new THREE.Points(geo, mat);
scene.add(points);

function animate() {
  requestAnimationFrame(animate);
  points.rotation.y += 0.0006;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ===== Hero 按钮弹窗 =====
const heroModals = {
  contact: {
    title: 'CONTACT',
    items: [
      {icon: '✉', text: 'regal001@hotmail.com'},
      {icon: '🌐', text: 'Topdonor'},
      {icon: '📍', text: 'www.Legendofdzi.com'},
      {icon: '◉', text: 'Energy · Destiny · Protection'}
    ]
  },
  showcase: {
    title: 'SHOWCASE ENTRY',
    items: [
      {icon: '', text: '欢迎进入天珠展馆系统'},
      {icon: '', text: '这是一个关于能量、信仰与结构的沉浸空间'}
    ]
  }
};

// ===== 卡片菜单数据 =====
const menuData = [
  {
    title: 'ORIGIN RELIC',
    subs: [
      {
        name: '喜马拉雅文明遗存',
        landing: {
          heading: '喜马拉雅文明遗存',
          sections: [
            {label: 'INTRODUCTION', text: 'Dzi beads are ancient etched agate beads of mysterious origin. They have been found primarily in Tibet, though they can also be found in neighboring Himalayan regions.'},

          ]
        }
      },
      {
        name: '被视为天地能量结晶',
        landing: {
          heading: '被视为天地能量结晶',
          sections: [
            {label: 'OVERVIEW', text: 'The belief in the divine origin of Dzi beads persists throughout Tibetan and Himalayan cultures. Ancient texts describe them as crystallized energy from the heavens.'},
            {label: 'SPIRITUAL POWER', text: 'Each Dzi bead is thought to harness cosmic energies, channeling them into protective and healing forces for the bearer.'},
            {label: 'TRADITIONS', text: 'Generation after generation, Tibetan families pass Dzi beads as sacred heirlooms, preserving spiritual energy across lifetimes.'}
          ]
        }
      },
      {
        name: '神秘起源传说',
        landing: {
          heading: '神秘起源传说',
          sections: [
            {label: 'LEGENDS', text: 'Multiple legends surround the origin of Dzi beads. Some say they fell from the sky as meteorites, others believe they were crafted by ancient gods.'},
            {label: 'MYTHOLOGY', text: 'In Tibetan mythology, Dzi beads were once living insects that turned to stone when touched by human hands.'}
          ]
        }
      }
    ]
  },
  {
    title: 'EYE CODE SYSTEM',
    subs: [
      {
        name: '天珠眼纹图谱',
        landing: {
          heading: '天珠眼纹图谱',
          sections: [
            {label: 'EYE PATTERNS', text: 'The number of eyes on a Dzi bead determines its meaning and power. From single-eye to the rare nine-eye, each pattern carries unique significance.'},
            {label: 'CLASSIFICATION', text: 'Dzi beads are classified by the number, shape, and arrangement of their eye patterns, with each variation holding distinct spiritual meanings.'}
          ]
        }
      },
      {
        name: '符号密码解读',
        landing: {
          heading: '符号密码解读',
          sections: [
            {label: 'SYMBOLS', text: 'Beyond eyes, Dzi beads feature various sacred symbols including lightning bolts, lotus flowers, and geometric patterns that encode spiritual knowledge.'},
            {label: 'DECODING', text: 'Scholars and spiritual practitioners have developed systems for reading the symbolic language etched into genuine Dzi beads.'}
          ]
        }
      },
      {
        name: '珍稀版本收藏',
        landing: {
          heading: '珍稀版本收藏',
          sections: [
            {label: 'RARE EDITIONS', text: 'Certain Dzi bead types are extraordinarily rare. The most valuable specimens command prices exceeding millions of dollars at auction.'},
            {label: 'COLLECTOR GUIDE', text: 'Authentic ancient Dzi beads display specific weathering patterns, natural mineral deposits, and etching characteristics that distinguish them from reproductions.'}
          ]
        }
      }
    ]
  },
  {
    title: 'PROTECTION FIELD',
    subs: [
      {
        name: '灵性护盾之力',
        landing: {
          heading: '灵性护盾之力',
          sections: [
            {label: 'PROTECTION', text: 'Dzi beads are traditionally worn as powerful protective talismans. Their spiritual energy is said to create an invisible shield around the wearer.'},

          ]
        }
      },
      {

          sections: [
            {label: 'PROSPERITY', text: 'Certain Dzi bead patterns, particularly those with multiple eyes, are associated with attracting wealth, good fortune, and business success.'},

          ]
        }
      }
    ]
  },
  {
    title: 'ENERGY UNIVERSE',
    subs: [
      {
        name: '宇宙频率共振',
        landing: {
          heading: '宇宙频率共振',

      {

// ===== 弹窗逻辑 =====
let currentCardIndex = -1;
let currentModalType = '';

function openHeroModal(type) {
  currentModalType = type;
  currentCardIndex = -1;
  const data = heroModals[type];
  document.getElementById('modalTitle').textContent = data.title;

  const container = document.getElementById('modalItems');
  container.innerHTML = '';
  data.items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'block';
    el.style.cursor = 'default';
    el.innerHTML = `${item.icon ? item.icon + ' ' : ''}${item.text}`;
    container.appendChild(el);
  });

  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function openModal(cardIndex) {
  currentCardIndex = cardIndex;
  currentModalType = 'card';
  const data = menuData[cardIndex];
  document.getElementById('modalTitle').textContent = data.title;

  const container = document.getElementById('modalItems');
  container.innerHTML = '';
  data.subs.forEach((sub, i) => {
    const item = document.createElement('div');
    item.className = 'block block-clickable';
    item.onclick = () => openLanding(cardIndex, i);
    item.innerHTML = `<span>${sub.name}</span><span class="block-arrow">▶</span>`;
    container.appendChild(item);
  });

  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

// ===== 落地页 =====
function openLanding(cardIndex, subIndex) {
  const card = menuData[cardIndex];
  const sub = card.subs[subIndex];
  const landing = sub.landing;

  document.getElementById('landingCategory').textContent = card.title;
  document.getElementById('landingTitle').textContent = landing.heading;

  const container = document.getElementById('landingContent');
  container.innerHTML = '';
  landing.sections.forEach(sec => {
    const section = document.createElement('div');
    section.className = 'landing-section';
    section.innerHTML = `
      <div class="landing-label">${sec.label}</div>
      <textarea class="landing-textarea" placeholder="在此编辑内容…">${sec.text}</textarea>
    `;
    container.appendChild(section);
  });

  document.getElementById('modal').classList.remove('active');
  document.getElementById('landing').classList.add('active');
  document.getElementById('landing').scrollTop = 0;
}

function closeLanding() {
  document.getElementById('landing').classList.remove('active');
  if (currentCardIndex >= 0) openModal(currentCardIndex);
  else document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('landing').classList.contains('active')) {
      closeLanding();
    } else if (document.getElementById('modal').classList.contains('active')) {
      closeModal();
    }
  }
});
</script>
