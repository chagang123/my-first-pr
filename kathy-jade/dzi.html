<style>

body {

  text-rendering: geometricPrecision;
}

a { color: inherit; text-decoration: none; }

/* ══════ 开场动画 ══════ */
.splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1.8s ease;
}
.splash.fade-out { opacity: 0; pointer-events: none; }

.splash-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(32px, 6vw, 64px);
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffe0a8 0%, #d4a050 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  text-shadow: 0 0 60px rgba(220, 170, 60, .2);
}

.splash-sub {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(11px, 1.5vw, 16px);
  font-weight: 400;
  letter-spacing: .2em;
  color: rgba(210, 195, 165, .5);
  font-style: italic;
}

/* ══════ 星空画布 ══════ */
canvas#stars {
  position: fixed;

  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ══════ 主内容（开场动画结束后显示） ══════ */
.main-content {
  opacity: 0;
  transition: opacity .5s ease;
}
.main-content.visible { opacity: 1; }

/* ══════ 第一屏：Hero ══════ */
.hero {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}

.hero::before {
  content: '';

  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 700px;
  height: 700px;
  background: radial-gradient(
    ellipse at center,
    rgba(180, 150, 80, .03) 0%,
    transparent 50%

  pointer-events: none;
}

.hero-title {
  font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  font-size: clamp(64px, 12vw, 140px);
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1.1;
  background: linear-gradient(
    180deg,
    #ffd78a 0%,
    #f0b840 25%,
    #d89520 55%,
    #b87018 100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 20px;
  text-shadow: 0 0 40px rgba(240, 180, 60, .15);

}

.hero-subtitle {

  letter-spacing: .35em;
  color: rgba(220, 190, 140, .5);
  font-weight: 400;
  margin-bottom: 48px;
}

.hero-buttons {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  display: inline-block;
  padding: 14px 44px;
  border-radius: 40px;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  transition: all .3s;
  cursor: pointer;
  border: none;
}
.btn-solid {
  background: linear-gradient(135deg, #e87830, #f09040);
  color: #fff;
  box-shadow: 0 4px 24px rgba(232, 120, 48, .3);
}
.btn-solid:hover {
  box-shadow: 0 6px 32px rgba(232, 120, 48, .45);
  transform: translateY(-1px);
}

.scroll-hint {
  position: absolute;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  background: rgba(220, 180, 120, .4);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: .3; transform: translateX(-50%) scale(1); }
  50% { opacity: .8; transform: translateX(-50%) scale(1.5); }
}

/* ══════ 第二屏：Showcase ══════ */
.showcase {

.cards {

.card {

  border-radius: 12px;

  setTimeout(() => {

// ══════ 星空粒子（旋转星空） ══════
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w, h, particles = [];
let cx, cy;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  w = window.innerWidth;
  h = window.innerHeight * 3;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = w / 2;
  cy = h / 2;
}

function createParticles() {
  particles = [];
  const count = Math.floor((w * h) / 1200);
  const maxDist = Math.hypot(cx, cy) * 1.1;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.pow(Math.random(), 0.6) * maxDist;
    const big = Math.random() < 0.25;
    particles.push({
      angle,
      dist,
      r: big ? Math.random() * 3 + 1.8 : Math.random() * 1.2 + 0.3,
      alpha: big ? Math.random() * 0.5 + 0.5 : Math.random() * 0.35 + 0.15,
      orbitSpeed: (0.00008 + Math.random() * 0.00025) * (Math.random() < 0.5 ? 1 : -1),
      flicker: Math.random() * Math.PI * 2,
      flickerSpeed: Math.random() * 0.6 + 0.2,
      square: big,
      hue: 38 + Math.random() * 10,
      lightness: big ? 65 + Math.random() * 10 : 50 + Math.random() * 15
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  const t = Date.now() * 0.001;
  for (const p of particles) {
    p.angle += p.orbitSpeed;
    const x = cx + Math.cos(p.angle) * p.dist;
    const y = cy + Math.sin(p.angle) * p.dist;
    if (x < -10 || x > w + 10 || y < -10 || y > h + 10) continue;
    const a = p.alpha * (0.65 + 0.35 * Math.sin(t * p.flickerSpeed + p.flicker));
    ctx.fillStyle = `hsla(${p.hue}, 100%, ${p.lightness}%, ${a})`;
    if (p.square) {
      const s = p.r * 1.2;
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    } else {
      ctx.beginPath();
      ctx.arc(x, y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); createParticles(); });
resize();
createParticles();
draw();

// ══════ 弹窗逻辑 ══════
let currentCardIndex = -1;
let currentModalType = '';

function openHeroModal(type) {
  currentModalType = type;
  currentCardIndex = -1;
  const data = heroModals[type];
  document.getElementById('modalTitle').textContent = data.title;

  const container = document.getElementById('modalItems');
  container.innerHTML = '';
  data.items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'modal-item';
    el.style.cursor = 'default';
    el.innerHTML = `
      ${item.icon ? '<span class="modal-item-icon">' + item.icon + '</span>' : ''}
      <span class="modal-item-text">${item.text}</span>
    `;
    container.appendChild(el);
  });

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function openModal(cardIndex) {
  currentCardIndex = cardIndex;
  currentModalType = 'card';
  const data = menuData[cardIndex];
  document.getElementById('modalTitle').textContent = data.title;

  const container = document.getElementById('modalItems');
  container.innerHTML = '';
  data.subs.forEach((sub, i) => {
    const item = document.createElement('div');
    item.className = 'modal-item';
    item.onclick = () => openLanding(cardIndex, i);
    item.innerHTML = `
      <span class="modal-item-text">${sub.name}</span>
      <span class="modal-item-arrow">▶</span>
    `;
    container.appendChild(item);
  });

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// ══════ 落地页逻辑 ══════
function openLanding(cardIndex, subIndex) {
  const card = menuData[cardIndex];
  const sub = card.subs[subIndex];
  const landing = sub.landing;

  document.getElementById('landingCategory').textContent = card.title;
  document.getElementById('landingTitle').textContent = landing.heading;

  const container = document.getElementById('landingContent');
  container.innerHTML = '';
  landing.sections.forEach(sec => {
    const section = document.createElement('div');
    section.className = 'landing-section';
    section.innerHTML = `
      <div class="landing-label">${sec.label}</div>
      <textarea class="landing-textarea" placeholder="在此编辑内容…">${sec.text}</textarea>
    `;
    container.appendChild(section);
  });

  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('landingOverlay').classList.add('active');
  document.getElementById('landingOverlay').scrollTop = 0;
}

function closeLanding() {
  document.getElementById('landingOverlay').classList.remove('active');
  if (currentCardIndex >= 0) openModal(currentCardIndex);
  else document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('landingOverlay').classList.contains('active')) {
      closeLanding();
    } else if (document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();
    }
  }
});
</script>
