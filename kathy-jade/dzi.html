<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西藏天珠 — Legend of Dzi</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
  font-family: 'DziTitle';
  src: local('Microsoft YaHei'), local('PingFang SC'), local('Noto Sans SC');
}

body {
  background: #050505;
  color: #e8dcc8;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

/* ══════ 星空画布 ══════ */
canvas#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ══════ 第一屏：Hero ══════ */
.hero {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}

/* 中心光晕 */
.hero::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 700px;
  height: 700px;
  background: radial-gradient(
    ellipse at center,
    rgba(200, 140, 50, .18) 0%,
    rgba(180, 100, 30, .08) 35%,
    transparent 70%
  );
  pointer-events: none;
}

.hero-title {
  font-size: clamp(64px, 12vw, 140px);
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1.1;
  background: linear-gradient(
    180deg,
    #f0c56e 0%,
    #e8a140 40%,
    #d07828 70%,
    #b85a18 100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 40px rgba(210, 140, 50, .25));
  margin-bottom: 20px;
}

.hero-subtitle {
  font-size: clamp(13px, 1.8vw, 18px);
  letter-spacing: .35em;
  color: rgba(220, 190, 140, .6);
  font-weight: 300;
  margin-bottom: 48px;
}

.hero-buttons {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  display: inline-block;
  padding: 14px 44px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  transition: all .3s;
  cursor: pointer;
}
.btn-solid {
  background: linear-gradient(135deg, #e87830, #f09040);
  color: #fff;
  border: none;
  box-shadow: 0 4px 24px rgba(232, 120, 48, .3);
}
.btn-solid:hover {
  box-shadow: 0 6px 32px rgba(232, 120, 48, .45);
  transform: translateY(-1px);
}

/* 底部滚动提示 */
.scroll-hint {
  position: absolute;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  background: rgba(220, 180, 120, .4);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: .3; transform: translateX(-50%) scale(1); }
  50% { opacity: .8; transform: translateX(-50%) scale(1.5); }
}

/* ══════ 第二屏：Showcase ══════ */
.showcase {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 40px;
  max-width: 1300px;
  margin: 0 auto;
}

.showcase-title {
  font-size: clamp(36px, 6vw, 72px);
  font-weight: 800;
  letter-spacing: .06em;
  line-height: 1.15;
  background: linear-gradient(
    180deg,
    #f0c56e 0%,
    #e8a140 50%,
    #c87020 100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 48px;
  font-style: italic;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 80px;
}

.card {
  border: 1px solid rgba(180, 150, 100, .2);
  border-radius: 12px;
  padding: 32px 24px;
  background: rgba(255, 255, 255, .02);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: border-color .3s, background .3s;
  cursor: pointer;
}
.card:hover {
  border-color: rgba(220, 170, 80, .4);
  background: rgba(255, 255, 255, .04);
}
.card-title {
  font-size: clamp(14px, 1.6vw, 18px);
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(230, 200, 140, .85);
  line-height: 1.4;
}

/* ══════ Footer ══════ */
.footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 0 40px 60px;
}
.footer-domain {
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 700;
  background: linear-gradient(180deg, #e8b860, #c88030);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.footer-copy {
  font-size: 11px;
  letter-spacing: .25em;
  color: rgba(180, 160, 120, .4);
  text-transform: uppercase;
}

/* ══════ 响应式 ══════ */
@media (max-width: 768px) {
  .cards {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .showcase { padding: 60px 24px; }
  .btn { padding: 12px 32px; font-size: 12px; }
}
@media (max-width: 480px) {
  .cards { grid-template-columns: 1fr; }
  .hero-buttons { flex-direction: column; align-items: center; }
  .btn { width: 220px; text-align: center; }
}
</style>
</head>
<body>

<!-- ============================
     ✦ 修改文字指南 ✦
     找到下面带 ← 的地方，直接改文字就行
     ============================ -->

<canvas id="stars"></canvas>

<!-- 第一屏 -->
<section class="hero">
  <h1 class="hero-title">西藏天珠</h1>                    <!-- ← 主标题 -->
  <p class="hero-subtitle">LEGEND OF DZI</p>              <!-- ← 副标题 -->
  <div class="hero-buttons">
    <a href="#contact" class="btn btn-solid">CONTACT</a>          <!-- ← 按钮1 -->
    <a href="#showcase" class="btn btn-solid">ENTER SHOWCASE</a>  <!-- ← 按钮2 -->
  </div>
  <div class="scroll-hint"></div>
</section>

<!-- 第二屏 -->
<section class="showcase" id="showcase">
  <h2 class="showcase-title">LEGEND OF DZI</h2>           <!-- ← 板块标题 -->
  <div class="cards">
    <div class="card">
      <div class="card-title">ORIGIN RELIC</div>           <!-- ← 卡片1 -->
    </div>
    <div class="card">
      <div class="card-title">EYE CODE<br>SYSTEM</div>     <!-- ← 卡片2 -->
    </div>
    <div class="card">
      <div class="card-title">PROTECTION<br>FIELD</div>    <!-- ← 卡片3 -->
    </div>
    <div class="card">
      <div class="card-title">ENERGY<br>UNIVERSE</div>     <!-- ← 卡片4 -->
    </div>
  </div>
</section>

<!-- 底部 -->
<footer class="footer" id="contact">
  <div class="footer-domain">Legendofdzi.com</div>         <!-- ← 域名 -->
  <div class="footer-copy">&copy; 2026 IMMERSIVE SHOWCASE SYSTEM</div> <!-- ← 版权 -->
</footer>

<script>
// 星空粒子
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w, h, particles = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight * 3;
}

function createParticles() {
  particles = [];
  const count = Math.floor((w * h) / 6000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.3,
      alpha: Math.random() * 0.6 + 0.1,
      drift: (Math.random() - 0.5) * 0.15,
      speed: Math.random() * 0.08 + 0.02,
      flicker: Math.random() * Math.PI * 2
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  const t = Date.now() * 0.001;
  for (const p of particles) {
    const a = p.alpha * (0.6 + 0.4 * Math.sin(t * p.speed * 10 + p.flicker));
    const hue = 30 + Math.random() * 10;
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.drift;
    if (p.x < -5) p.x = w + 5;
    if (p.x > w + 5) p.x = -5;
  }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); createParticles(); });
resize();
createParticles();
draw();
</script>
</body>
</html>
