<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>逼死强迫症</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- 首页 -->
<section id="home" class="screen">
  <canvas id="hero-cv"></canvas>
  <div class="home-top">
    <h1><span>逼<button id="crook" type="button" aria-label="把这个字摆正">死</button></span><span>强迫症</span></h1>
    <p id="crook-note">东西全摆歪了，你来把它们摆正</p>
  </div>
  <div class="home-panel">
    <p id="home-best"></p>
    <button id="btn-start" type="button" class="btn-main">开始摆正</button>
    <nav class="home-nav">
      <button id="nav-levels" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span>选关</span>
      </button>
      <button id="nav-help" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17" r=".6" class="dot"/></svg>
        <span>玩法</span>
      </button>
      <button id="nav-sound" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        <span id="sound-label">声音</span>
      </button>
      <button id="nav-follow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 19.5a6.5 6.5 0 0 1 13 0"/><path class="plus" d="M19 7v6M16 10h6"/></svg>
        <span id="follow-label">关注作者</span>
      </button>
    </nav>
  </div>
</section>

<!-- 游戏 -->
<section id="game" class="screen hidden">
  <header id="bar">
    <button id="btn-back" type="button" class="round" aria-label="返回主页">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <div class="bar-mid">
      <div id="level">第 1 关</div>
      <div id="progress"></div>
    </div>
    <button id="btn-hint" type="button" class="round" aria-label="提示">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button id="btn-restart" type="button" class="round" aria-label="重来">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12a6.5 6.5 0 1 0 2-4.7"/><path d="M5 4v4h4"/></svg>
    </button>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <p id="tip"></p>
</section>

<!-- 结算：白色抽屉从下面升起，上面露出摆整齐的画面 -->
<div id="overlay" class="hidden">
  <div id="sheet">
    <p id="r-kicker"></p>
    <h2 id="r-title"></h2>
    <p id="r-sub"></p>
    <div class="r-time"><strong id="r-num"></strong><span>秒</span><em id="r-best"></em></div>
    <button id="r-main" type="button" class="btn-main"></button>
    <div class="r-links">
      <button id="r-share" type="button">晒一下</button>
      <button id="r-again" type="button">再玩一次</button>
      <button id="r-home" type="button">返回主页</button>
    </div>
  </div>
</div>

<!-- 弹框 -->
<div id="dialog" class="hidden">
  <div id="dlg-box">
    <p id="dlg-kicker"></p>
    <h3 id="dlg-title"></h3>
    <div id="dlg-body"></div>
    <button id="dlg-main" type="button" class="btn-main"></button>
    <button id="dlg-second" type="button" class="btn-text"></button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="./game.js"></script>
</body>
</html>
